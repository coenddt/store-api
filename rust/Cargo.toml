[package]
name = "store-api-rs"
version = "0.1.0"
edition = "2021"
description = "Axum adapter that auto-generates RESTful APIs for rust-store schemas — third runtime of the store-api family (spec-driven parity with store-api-node / store-api-py)."
license = "MIT"

[lib]
name = "store_api_rs"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
form_urlencoded = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"
