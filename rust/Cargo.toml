[package]
name = "store-api-rs"
version = "0.1.0"
edition = "2021"
description = "Axum adapter that auto-generates RESTful APIs for rust-store schemas — third runtime of the store-api family (spec-driven parity with store-api-node / store-api-py)."
license = "MIT"

[lib]
name = "store_api_rs"
path = "src/lib.rs"

[features]
# 开箱桥接：rust-store 宿主（rust_store::Store）→ 本 crate 的 Store trait。
# 默认开启：`cargo test` 无需记忆 --features（e2e/conformance 默认全跑）；
# `--no-default-features` 供验证纯库形态（mock smoke）。注意：发布 crates.io 前须
# 重新决策 default（git 依赖不宜作为库的默认 feature；届时改为版本依赖再评估）。
# 开发期依赖经 [patch] 段指向本机仓库。
default = ["rust-store"]
rust-store = ["dep:rust-store", "dep:rust-store-core"]

[dependencies]
axum = "0.8"
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
form_urlencoded = "1"
tokio = { version = "1", features = ["rt", "sync"] }

# 可选：rust-store 纯 Rust 宿主（gitee 为主源，github 镜像备用）
rust-store = { git = "https://gitee.com/coenddt/rust-store.git", optional = true }
rust-store-core = { git = "https://gitee.com/coenddt/rust-store.git", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"
# 桥接 e2e：直查 SQLite 验证归档表与 DDL（与 rust-store 宿主同版本线）
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

# 开发期：git 依赖 patch 到本机仓库（本地领先远端；发布时移除本段恢复 git/版本依赖）
[patch."https://gitee.com/coenddt/rust-store.git"]
rust-store = { path = "../../rust-store/host" }
rust-store-core = { path = "../../rust-store/core" }
