[project]
name = "store-api-py"
version = "0.4.0"
description = "FastAPI adapter that auto-generates RESTful APIs for py-store schemas (schema-driven CRUD over GQL)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["py-store", "storepy", "fastapi", "rest", "crud", "gql"]
dependencies = ["fastapi>=0.110"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
